<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presentations — UnoPresentation</title>
<meta name="description" content="Upload, switch between and present live decks the whole room can follow on their phones.">
<meta name="theme-color" content="#101013">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#101013; --panel:#1C1C21; --panel2:#17171B;
    --line:#2B2B33; --line2:#3A3A44;
    --ink:#F3F3F1; --mute:#9E9EA6; --dim:#7C7C85; --accent:#E2545C;
    --ok:#3C9E5A; --warn:#C8A23A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%}
  body{min-height:100dvh}
  a{color:var(--accent);text-decoration:none}
  a:hover{color:var(--ink)}
  code{background:#0C0C0E;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:.92em}

  .amb{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .amb i{position:absolute;display:block;border-radius:50%}
  .amb i:nth-child(1){width:1100px;height:1100px;left:-300px;top:-420px;background:radial-gradient(circle,#2B1F26 0%,rgba(43,31,38,.4) 42%,rgba(22,22,25,0) 72%)}
  .amb i:nth-child(2){width:900px;height:900px;right:-240px;bottom:-320px;background:radial-gradient(circle,rgba(226,84,92,.09) 0%,rgba(226,84,92,.03) 42%,rgba(22,22,25,0) 72%)}

  .wrap{position:relative;z-index:1;max-width:940px;margin:0 auto;padding:44px 24px 110px}
  @media(max-width:640px){.wrap{padding:26px 16px 90px}}

  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.3em;color:var(--accent)}
  h1{margin:9px 0 0;font-size:36px;line-height:1.1;letter-spacing:-.025em}
  @media(max-width:640px){h1{font-size:28px}}
  header.top{display:flex;align-items:flex-start;gap:16px;margin-bottom:32px}
  .who{margin-left:auto;font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}

  .btn{appearance:none;border:1px solid var(--line2);background:#232329;color:var(--ink);border-radius:9px;padding:9px 14px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:#5A5A66}
  .btn:disabled{opacity:.45;cursor:default}
  .btn-quiet{background:transparent;border-color:transparent;color:var(--dim);padding:9px 9px}
  .btn-quiet:hover{color:var(--ink);border-color:var(--line)}
  .btn-danger:hover{border-color:var(--accent);color:var(--accent)}
  .btn-go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;font-size:15px;padding:14px 26px;border-radius:11px}
  .btn-go:hover{background:#d0444c;border-color:#d0444c;color:#fff}

  /* ── Way in ──────────────────────────────────────────────── */
  .gate{max-width:430px;margin:11vh auto 0;text-align:center}
  .gate p{color:var(--mute);font-size:15px;line-height:1.6}
  .gate form{display:flex;gap:8px;margin-top:22px}
  .gate input{flex:1;min-width:0}
  input[type=password],input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 13px;color:var(--ink);font:inherit;font-size:14px}
  input:focus{outline:none;border-color:var(--accent)}

  /* ── Now presenting ──────────────────────────────────────── */
  .hero{background:linear-gradient(180deg,#211A1D 0%,#1A1A1F 100%);border:1px solid #47313A;border-radius:18px;padding:26px 26px 24px}
  .hero-k{font-size:11px;font-weight:700;letter-spacing:.24em;color:var(--accent)}
  .hero-name{margin:12px 0 0;font-size:30px;font-weight:700;line-height:1.15;letter-spacing:-.02em;word-break:break-word}
  @media(max-width:640px){.hero-name{font-size:24px}}
  .hero-meta{margin-top:8px;font-size:13px;color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
  .hero-acts{margin-top:22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .hero-hint{margin:16px 0 0;font-size:13px;color:var(--mute);line-height:1.6}
  .hero-hint b{color:var(--ink)}
  .hero-none{border-style:dashed;border-color:var(--line2);background:var(--panel2);text-align:center}
  .hero-none .hero-name{font-size:20px;color:var(--mute);font-weight:400}

  /* ── List ────────────────────────────────────────────────── */
  .sec{margin-top:38px}
  .sec-h{font-size:11px;font-weight:700;letter-spacing:.24em;color:var(--dim);margin-bottom:12px}
  .list{display:flex;flex-direction:column;gap:10px}
  .deck{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 17px;display:flex;align-items:center;gap:14px}
  @media(max-width:700px){.deck{flex-wrap:wrap}}
  .deck-main{flex:1;min-width:0}
  .deck-name{font-size:17px;font-weight:700;letter-spacing:-.01em;word-break:break-word}
  .deck-meta{margin-top:4px;font-size:12px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap}
  .deck-acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.06em;border-radius:999px;padding:3px 9px;border:1px solid var(--line2);color:var(--dim)}
  .tag-warn{border-color:#5C4E2F;color:var(--warn)}

  /* ── Upload ──────────────────────────────────────────────── */
  .drop{margin-top:16px;border:1px dashed var(--line2);border-radius:14px;padding:26px 22px;text-align:center;color:var(--mute);transition:border-color .15s,background .15s;cursor:pointer}
  .drop:hover,.drop.over{border-color:var(--accent);background:rgba(226,84,92,.05);color:var(--ink)}
  .drop b{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}
  .drop small{font-size:12.5px;color:var(--dim)}
  .bar{height:3px;background:#2A2A31;border-radius:2px;overflow:hidden;margin-top:14px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

  .empty{text-align:center;color:var(--dim);padding:26px 20px;font-size:14px;line-height:1.7}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:50;background:#1E1E24;border:1px solid var(--line2);border-radius:10px;padding:12px 18px;font-size:14px;box-shadow:0 14px 40px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}
  .toast.err{border-color:var(--accent);color:#FFD9DB}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="amb" aria-hidden="true"><i></i><i></i></div>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">UNOPRESENTATION</div>
      <h1>Presentations</h1>
    </div>
    <div class="who hide" id="who">
      <button class="btn btn-quiet" id="signOut">Lock</button>
    </div>
  </header>

  <!-- Way in -->
  <section class="gate hide" id="gate">
    <div class="eyebrow" style="letter-spacing:.24em" id="gateKicker">SIGN IN</div>
    <p style="margin-top:14px" id="gateBlurb">Checking…</p>
    <form id="gateForm">
      <input type="password" id="pass" placeholder="Passphrase" autocomplete="current-password" required>
      <button class="btn btn-go" style="font-size:13px;padding:11px 16px" type="submit" id="gateBtn">Open</button>
    </form>
    <p id="gateMsg" style="margin-top:16px;font-size:13.5px"></p>
  </section>

  <!-- Dashboard -->
  <section class="hide" id="app">
    <div id="hero"></div>

    <div class="sec">
      <div class="sec-h" id="allHead">ALL PRESENTATIONS</div>
      <div class="list" id="list"></div>
      <div class="empty hide" id="empty">
        Nothing here yet — drop a deck below to get started.
      </div>

      <div class="drop" id="drop" role="button" tabindex="0">
        <b>Drop a deck here, or choose a file</b>
        <small>An <code>index.html</code> built by this project. It is read before upload, never blindly stored.</small>
        <div class="bar hide" id="upBar"><i></i></div>
        <input type="file" id="file" accept=".html,text/html" class="hide" multiple>
      </div>
    </div>
  </section>
</div>

<script>
/* No Supabase Auth, no email, no redirects, nothing to configure. This is one
   person's dashboard, opened with a passphrase they choose the first time.
   Every write goes through the deck-admin edge function, which holds the
   service role -- the tables and the bucket stay shut to the browser. */
/* Bumped whenever this page changes. GitHub Pages serves it with a ten minute
   max-age and browsers hold it longer, so without this a stale dashboard keeps
   running against a moved-on backend -- which is exactly how an old copy ended
   up inserting rows the database no longer accepts. */
var APP_BUILD = '2026-09-18-passphrase-1';

var SUPABASE = 'https://wbmzoscwlaanwtiloufs.supabase.co';
var FN = SUPABASE + '/functions/v1/deck-admin';
var PRESENT = location.origin + location.pathname.replace(/[^/]*$/, '') + 'present/';
var STORE = 'unopresentation.key';

var $ = function (s) { return document.querySelector(s); };
var key = null;
var claimed = false;

function toast(msg, isErr) {
  var t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, isErr ? 7000 : 3200);
}
function fmtSize(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB'; }
function fmtWhen(iso) {
  var d = new Date(iso), diff = (Date.now() - d) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
  return d.toLocaleDateString();
}

/* Decks are served from here, not from Supabase: Supabase rewrites HTML to
   text/plain and attaches a sandbox CSP, so a deck opened on its domain would
   never run. See present/index.html. */
function deckUrl(d) { return PRESENT + '?p=' + encodeURIComponent(d.path); }

async function api(action, body) {
  var headers = { 'Content-Type': 'application/json' };
  if (key) headers['x-deck-key'] = key;
  var payload = Object.assign({ action: action }, body || {});
  var res = await fetch(FN, { method: 'POST', headers: headers, body: JSON.stringify(payload) });
  var out = {};
  try { out = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(out.error || ('Request failed (' + res.status + ')'));
  return out;
}

/* ── Way in ───────────────────────────────────────────────── */
async function boot() {
  try {
    var st = await api('status');
    claimed = !!st.claimed;
  } catch (e) {
    $('#gate').classList.remove('hide');
    $('#gateBlurb').textContent = 'Could not reach the server.';
    $('#gateMsg').innerHTML = '<span style="color:var(--accent)">' + e.message + '</span>';
    return;
  }

  $('#gateKicker').textContent = claimed ? 'SIGN IN' : 'FIRST TIME';
  $('#gateBlurb').textContent = claimed
    ? 'Enter your passphrase to get to your decks.'
    : 'Nobody has set this up yet. Choose a passphrase — it is the only thing that opens this page, so make it a real one.';
  $('#pass').setAttribute('autocomplete', claimed ? 'current-password' : 'new-password');
  $('#gateBtn').textContent = claimed ? 'Open' : 'Set it';

  var saved = null;
  try { saved = localStorage.getItem(STORE); } catch (e) {}
  if (claimed && saved) {
    key = saved;
    try {
      await refresh();
      show(true);
      return;
    } catch (e) {
      key = null;
      try { localStorage.removeItem(STORE); } catch (e2) {}
    }
  }
  show(false);
}

function show(inside) {
  $('#gate').classList.toggle('hide', inside);
  $('#app').classList.toggle('hide', !inside);
  $('#who').classList.toggle('hide', !inside);
}

$('#gateForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var pass = $('#pass').value;
  if (!pass) return;
  $('#gateMsg').textContent = 'One moment…';
  try {
    if (!claimed) { await api('claim', { passphrase: pass }); claimed = true; }
    key = pass;
    await refresh();
    try { localStorage.setItem(STORE, pass); } catch (e2) {}
    $('#gateMsg').textContent = '';
    $('#pass').value = '';
    show(true);
  } catch (err) {
    key = null;
    $('#gateMsg').innerHTML = '<span style="color:var(--accent)">' + err.message + '</span>';
  }
});

$('#signOut').addEventListener('click', function () {
  key = null;
  try { localStorage.removeItem(STORE); } catch (e) {}
  $('#list').innerHTML = '';
  $('#hero').innerHTML = '';
  show(false);
});

/* ── Read a deck before storing it ────────────────────────────
   Uploading a file nobody has looked at is how a dashboard ends up serving
   something that is not a deck. */
async function inspect(file) {
  var text = await file.text();
  var doc = new DOMParser().parseFromString(text, 'text/html');
  var titleEl = doc.querySelector('title');
  var title = (titleEl ? titleEl.textContent : '').trim();
  // Slides ride inside the bundler template, invisible to DOMParser, so the
  // raw source is the reliable count.
  var slides = Math.max(
    doc.querySelectorAll('section[data-label]').length,
    (text.match(/<section[^>]*\sdata-label=/g) || []).length
  );
  return {
    text: text, title: title, slides: slides, size: file.size,
    hasDeck: /deck-stage/.test(text),
    hasLive: /lv-stage-panel|__liveHash/.test(text)
  };
}

async function upload(files) {
  var bar = $('#upBar'), fill = bar.querySelector('i');
  bar.classList.remove('hide');
  var done = 0;

  for (var i = 0; i < files.length; i++) {
    var file = files[i];
    fill.style.width = Math.round((done / files.length) * 100) + '%';
    try {
      if (!/\.html?$/i.test(file.name)) { toast(file.name + ' is not an HTML file', true); done++; continue; }
      var info = await inspect(file);
      if (!info.hasDeck) { toast(file.name + ' does not look like a deck', true); done++; continue; }
      var name = info.title || file.name.replace(/\.html?$/i, '');

      // The function signs it; the file goes straight to storage from here, so
      // a 300KB deck never travels through the function.
      var sign = await api('sign-upload', { name: name });
      var put = await fetch(
        SUPABASE + '/storage/v1/object/upload/sign/decks/' + sign.path + '?token=' + encodeURIComponent(sign.token),
        { method: 'PUT', headers: { 'Content-Type': 'text/html' }, body: new Blob([info.text], { type: 'text/html' }) }
      );
      if (!put.ok) throw new Error('Upload failed (' + put.status + ')');

      await api('register', {
        name: name, path: sign.path, size_bytes: info.size, slides: info.slides,
        notes: info.hasLive ? null : 'no-live-layer'
      });

      toast(name + ' added — ' + info.slides + (info.slides === 1 ? ' slide' : ' slides'));
      if (!info.hasLive) toast(name + ' has no live layer: it presents, but phones cannot follow it', true);
    } catch (err) {
      toast((err.message || String(err)).slice(0, 180), true);
    }
    done++;
  }
  fill.style.width = '100%';
  setTimeout(function () { bar.classList.add('hide'); fill.style.width = '0'; }, 400);
  refresh();
}

/* ── Render ───────────────────────────────────────────────── */
async function refresh() {
  var out = await api('list');
  var decks = out.decks || [];
  var active = decks.filter(function (d) { return d.is_active; })[0] || null;
  renderHero(active);
  renderList(active ? decks.filter(function (d) { return d.id !== active.id; }) : decks, decks.length);
}

/* The hero is re-rendered on every refresh, so its handler is bound once to
   the container and reads whichever deck is current at click time. */
var activeDeck = null;
$('#hero').addEventListener('click', function (e) { if (activeDeck) act(e, activeDeck); });

function renderHero(d) {
  activeDeck = d;
  var hero = $('#hero');
  if (!d) {
    hero.innerHTML = '<div class="hero hero-none"><div class="hero-k" style="color:var(--dim)">NOW PRESENTING</div>' +
      '<p class="hero-name">Nothing set yet — pick a deck below.</p></div>';
    return;
  }
  hero.innerHTML = '<div class="hero"><div class="hero-k">NOW PRESENTING</div>' +
    '<p class="hero-name"></p>' +
    '<div class="hero-meta"><span>' + (d.slides || '?') + ' slides</span>' +
    '<span>' + (d.size_bytes ? fmtSize(d.size_bytes) : '') + '</span>' +
    '<span>updated ' + fmtWhen(d.updated_at) + '</span>' +
    (d.notes === 'no-live-layer' ? '<span class="tag tag-warn">no live layer</span>' : '') +
    '</div><div class="hero-acts">' +
    '<button class="btn btn-go" data-act="present">Start presenting</button>' +
    '<button class="btn" data-act="open">Open</button>' +
    '<button class="btn" data-act="link">Copy audience link</button></div>' +
    '<p class="hero-hint">Opens on this screen — then press <b>L</b> for the QR codes.</p></div>';
  hero.querySelector('.hero-name').textContent = d.name;
}

function renderList(decks, total) {
  var list = $('#list');
  list.innerHTML = '';
  $('#empty').classList.toggle('hide', total > 0);
  $('#allHead').classList.toggle('hide', decks.length === 0);

  decks.forEach(function (d) {
    var el = document.createElement('div');
    el.className = 'deck';
    el.innerHTML = '<div class="deck-main"><div class="deck-name"></div>' +
      '<div class="deck-meta"><span>' + (d.slides || '?') + ' slides</span>' +
      '<span>updated ' + fmtWhen(d.updated_at) + '</span>' +
      (d.notes === 'no-live-layer' ? '<span class="tag tag-warn">no live layer</span>' : '') +
      '</div></div><div class="deck-acts">' +
      '<button class="btn" data-act="activate">Make this the one</button>' +
      '<button class="btn btn-quiet" data-act="present">Present</button>' +
      '<button class="btn btn-quiet" data-act="rename">Rename</button>' +
      '<button class="btn btn-quiet btn-danger" data-act="delete">Delete</button></div>';
    el.querySelector('.deck-name').textContent = d.name;
    el.addEventListener('click', function (e) { act(e, d); });
    list.appendChild(el);
  });
}

async function act(e, d) {
  var a = e.target.getAttribute && e.target.getAttribute('data-act');
  if (!a) return;
  try {
    if (a === 'present') { window.open(deckUrl(d) + '#live', '_blank', 'noopener'); return; }
    if (a === 'open') { window.open(deckUrl(d), '_blank', 'noopener'); return; }
    if (a === 'link') {
      try { await navigator.clipboard.writeText(deckUrl(d)); toast('Link copied'); }
      catch (e2) { toast(deckUrl(d)); }
      return;
    }
    if (a === 'activate') { await api('activate', { id: d.id }); toast(d.name + ' is up next'); await refresh(); return; }
    if (a === 'rename') {
      var next = prompt('Name this presentation', d.name);
      if (next == null) return;
      var t = next.trim();
      if (!t || t === d.name) return;
      await api('rename', { id: d.id, name: t });
      toast('Renamed');
      await refresh();
      return;
    }
    if (a === 'delete') {
      if (!confirm('Delete "' + d.name + '"?\n\nThe file goes for good and any link to it stops working.')) return;
      await api('delete', { id: d.id });
      toast('Deleted');
      await refresh();
      return;
    }
  } catch (err) {
    toast((err.message || String(err)).slice(0, 180), true);
  }
}

/* ── Drop zone ────────────────────────────────────────────── */
var drop = $('#drop'), fileInput = $('#file');
drop.addEventListener('click', function () { fileInput.click(); });
drop.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
fileInput.addEventListener('change', function () {
  if (fileInput.files.length) upload([].slice.call(fileInput.files));
  fileInput.value = '';
});
['dragenter', 'dragover'].forEach(function (ev) {
  drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
});
['dragleave', 'drop'].forEach(function (ev) {
  drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
});
drop.addEventListener('drop', function (e) {
  var files = e.dataTransfer ? [].slice.call(e.dataTransfer.files) : [];
  if (files.length) upload(files);
});

/* Fetch this page past the cache and compare. A newer one on the server means
   the copy running here is stale, so step onto the new one. The replacement URL
   carries the new build, so after the reload the versions match and this stops. */
function checkForUpdate() {
  var here = location.pathname;
  fetch(here + '?v=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (t) {
      if (!t) return;
      var m = /var APP_BUILD = '([^']+)'/.exec(t);
      if (m && m[1] !== APP_BUILD) location.replace(here + '?v=' + encodeURIComponent(m[1]));
    })
    .catch(function () {});
}

checkForUpdate();
boot();
</script>
</body>
</html>

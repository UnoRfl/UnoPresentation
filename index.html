       and it does that before the shell below gets to look. A fragment it

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>UnoPresentation — The Deck That Follows You<\/title>\n<meta name=\"description\" content=\"A live-sync HTML presentation: put it on a projector, let the room scan a QR code, and every phone follows the slide you are on. Your own phone becomes the remote, with speaker notes, a timer and a pointer.\">\n<meta name=\"theme-color\" content=\"#101013\">\n<meta name=\"color-scheme\" content=\"dark\">\n<link rel=\"icon\" href=\"favicon.svg\" type=\"image/svg+xml\">\n<script src=\"51be032f-cae7-4457-9543-d064ef34b61f\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<style>\n  body { margin: 0; background: #101013; }\n  a { color: #E2545C; text-decoration: none; }\n  a:hover { color: #F3F3F1; }\n  @keyframes riseIn {\n    from { opacity: 0; transform: translateY(22px); filter: blur(5px); }\n    55%  { filter: blur(0); }\n    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }\n  }\n  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }\n  @keyframes ruleGrow { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }\n  @keyframes barGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }\n  @keyframes drift1 {\n    0% { transform: translate3d(0.000%, -0.000%, 0) scale(1.0000); }\n    6.25% { transform: translate3d(0.228%, -0.190%, 0) scale(1.0061); }\n    12.5% { transform: translate3d(0.879%, -0.732%, 0) scale(1.0234); }\n    18.75% { transform: translate3d(1.852%, -1.543%, 0) scale(1.0494); }\n    25% { transform: translate3d(3.000%, -2.500%, 0) scale(1.0800); }\n    31.25% { transform: translate3d(4.148%, -3.457%, 0) scale(1.1106); }\n    37.5% { transform: translate3d(5.121%, -4.268%, 0) scale(1.1366); }\n    43.75% { transform: translate3d(5.772%, -4.810%, 0) scale(1.1539); }\n    50% { transform: translate3d(6.000%, -5.000%, 0) scale(1.1600); }\n    56.25% { transform: translate3d(5.772%, -4.810%, 0) scale(1.1539); }\n    62.5% { transform: translate3d(5.121%, -4.268%, 0) scale(1.1366); }\n    68.75% { transform: translate3d(4.148%, -3.457%, 0) scale(1.1106); }\n    75% { transform: translate3d(3.000%, -2.500%, 0) scale(1.0800); }\n    81.25% { transform: translate3d(1.852%, -1.543%, 0) scale(1.0494); }\n    87.5% { transform: translate3d(0.879%, -0.732%, 0) scale(1.0234); }\n    93.75% { transform: translate3d(0.228%, -0.190%, 0) scale(1.0061); }\n    100% { transform: translate3d(0.000%, -0.000%, 0) scale(1.0000); }\n  }\n  @keyframes drift2 {\n    0% { transform: translate3d(-0.000%, 0.000%, 0) scale(1.1000); }\n    6.25% { transform: translate3d(-0.266%, 0.190%, 0) scale(1.0939); }\n    12.5% { transform: translate3d(-1.025%, 0.732%, 0) scale(1.0766); }\n    18.75% { transform: translate3d(-2.161%, 1.543%, 0) scale(1.0506); }\n    25% { transform: translate3d(-3.500%, 2.500%, 0) scale(1.0200); }\n    31.25% { transform: translate3d(-4.839%, 3.457%, 0) scale(0.9894); }\n    37.5% { transform: translate3d(-5.975%, 4.268%, 0) scale(0.9634); }\n    43.75% { transform: translate3d(-6.734%, 4.810%, 0) scale(0.9461); }\n    50% { transform: translate3d(-7.000%, 5.000%, 0) scale(0.9400); }\n    56.25% { transform: translate3d(-6.734%, 4.810%, 0) scale(0.9461); }\n    62.5% { transform: translate3d(-5.975%, 4.268%, 0) scale(0.9634); }\n    68.75% { transform: translate3d(-4.839%, 3.457%, 0) scale(0.9894); }\n    75% { transform: translate3d(-3.500%, 2.500%, 0) scale(1.0200); }\n    81.25% { transform: translate3d(-2.161%, 1.543%, 0) scale(1.0506); }\n    87.5% { transform: translate3d(-1.025%, 0.732%, 0) scale(1.0766); }\n    93.75% { transform: translate3d(-0.266%, 0.190%, 0) scale(1.0939); }\n    100% { transform: translate3d(-0.000%, 0.000%, 0) scale(1.1000); }\n  }\n  @keyframes drift3 {\n    0% { transform: translate3d(0.000%, 0.000%, 0) scale(0.9600); }\n    6.25% { transform: translate3d(0.190%, 0.266%, 0) scale(0.9691); }\n    12.5% { transform: translate3d(0.732%, 1.025%, 0) scale(0.9951); }\n    18.75% { transform: translate3d(1.543%, 2.161%, 0) scale(1.0341); }\n    25% { transform: translate3d(2.500%, 3.500%, 0) scale(1.0800); }\n    31.25% { transform: translate3d(3.457%, 4.839%, 0) scale(1.1259); }\n    37.5% { transform: translate3d(4.268%, 5.975%, 0) scale(1.1649); }\n    43.75% { transform: translate3d(4.810%, 6.734%, 0) scale(1.1909); }\n    50% { transform: translate3d(5.000%, 7.000%, 0) scale(1.2000); }\n    56.25% { transform: translate3d(4.810%, 6.734%, 0) scale(1.1909); }\n    62.5% { transform: translate3d(4.268%, 5.975%, 0) scale(1.1649); }\n    68.75% { transform: translate3d(3.457%, 4.839%, 0) scale(1.1259); }\n    75% { transform: translate3d(2.500%, 3.500%, 0) scale(1.0800); }\n    81.25% { transform: translate3d(1.543%, 2.161%, 0) scale(1.0341); }\n    87.5% { transform: translate3d(0.732%, 1.025%, 0) scale(0.9951); }\n    93.75% { transform: translate3d(0.190%, 0.266%, 0) scale(0.9691); }\n    100% { transform: translate3d(0.000%, 0.000%, 0) scale(0.9600); }\n  }\n\n  /* Everything below is screen-only. Print / PPTX export drives its own\n     animation state (it force-activates every slide and fast-forwards\n     animations to their end frame), so these rules must never apply\n     there -- a paused entrance would export at opacity 0. */\n  @media screen {\n    /* ─── perf: ambience gating ──────────────────────────────────────────\n       Every slide stays in the DOM (the stage only toggles visibility) and\n       the thumbnail rail adopts this same stylesheet into 8 shadow roots,\n       so the drift loops were running ~38x at once. `deck-stage` is the\n       live-document guard: thumbnail clones have no such ancestor, so they\n       settle on the 0% keyframe (= resting state, visually identical) and\n       cost nothing. Only the on-screen slide actually animates. */\n    /* !important is load-bearing throughout: the blobs carry an inline\n       `animation` shorthand, which resets these longhands to their initial\n       values at the highest non-important specificity. */\n    .amb > * { animation-play-state: paused !important; }\n    deck-stage > [data-deck-active] .amb > * {\n      animation-play-state: running !important;\n      /* The drift loops run 36-48s, so a blob moves well under a pixel per\n         frame -- yet every frame still invalidated a ~2M-pixel gradient. The\n         keyframes above sample the original ease-in-out path onto a cosine,\n         so the easing now lives in the keyframe data and the timing function\n         is free to quantise time: 144 ticks per cycle (~0.25s apart, under a\n         pixel of travel) instead of one re-raster per frame. Same path, same\n         speed, a fraction of the paint. */\n      animation-timing-function: steps(9, end) !important;\n    }\n    /* Entrance animations: same idea. They used to fire on every slide at\n       once during load; now each slide plays its build when you arrive. */\n    deck-stage > section:not([data-deck-active]) [data-anim] {\n      animation-play-state: paused !important;\n    }\n    @media (prefers-reduced-motion: reduce) {\n      .amb > * { animation: none !important; }\n    }\n  }\n\n  @keyframes breathe { 0%,100% { opacity: 0.55; } 50% { opacity: 0.9; } }\n\n  /* ══════════════════════════════════════════════════════════════════════\n     READING VIEW — the portrait/mobile companion.\n     A 16:9 canvas letterboxed into a portrait phone fills ~26% of the\n     screen and lands body copy near 5px, so the deck alone cannot carry\n     the content there. This is the same material in the deck's own visual\n     language (palette, type hierarchy, ambience, accent rules), reflowed\n     into one readable column. Landscape and desktop keep the real deck.\n     ══════════════════════════════════════════════════════════════════════ */\n  #mv { display: none; }\n\n  /* Default: deck on, reading view off. The body class is set by script\n     (and by the media query below when script hasn't run yet). */\n  body.mv-on #mv { display: block; }\n  /* The cursor glow is a deck effect; it must not float over the article. */\n  body.mv-on #dc-glow { display: none !important; }\n  body.mv-on deck-stage { display: none !important; }\n\n  #mv {\n    position: relative;\n    min-height: 100vh;\n    min-height: 100dvh;\n    background: #101013;\n    color: #F3F3F1;\n    font-family: Arial, Helvetica, sans-serif;\n    -webkit-text-size-adjust: 100%;\n  }\n  .mv-amb { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }\n  .mv-amb > i {\n    position: absolute; display: block; border-radius: 50%;\n  }\n  .mv-amb > i:first-child {\n    width: 150vw; height: 150vw; left: -55vw; top: -40vw;\n    background: radial-gradient(circle, #2B1F26 0%, rgba(43,31,38,0.40) 42%, rgba(16,16,19,0) 72%);\n  }\n  .mv-amb > i:last-child {\n    width: 130vw; height: 130vw; right: -50vw; bottom: -30vw;\n    background: radial-gradient(circle, rgba(226,84,92,0.11) 0%, rgba(226,84,92,0.035) 42%, rgba(16,16,19,0) 72%);\n  }\n\n  .mv-bar {\n    position: sticky; top: 0; z-index: 5;\n    display: flex; align-items: center; gap: 12px;\n    padding: calc(10px + env(safe-area-inset-top)) clamp(16px, 5vw, 28px) 10px;\n    background: rgba(16,16,19,0.82);\n    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);\n    border-bottom: 1px solid #22222a;\n  }\n  /* Read-progress hairline along the bottom edge of the sticky bar. --mv-p is\n     written by the scroll handler; 90ms smooths the step between rAF ticks\n     without lagging behind the thumb. */\n  .mv-bar::after {\n    content: \"\"; position: absolute; left: 0; bottom: -1px; height: 2px;\n    width: var(--mv-p, 0%); background: #E2545C;\n    transition: width 90ms linear;\n  }\n  @media (prefers-reduced-motion: reduce) { .mv-bar::after { transition: none; } }\n\n  /* The bar title is a control: it names the section you are in an ght: 1px; margin: 22px 0; background: linear-gradient(90deg, #313138, rgba(49,49,56,0)); }\n\n  .kicker {\n    margin: 26px 0 0; color: #9E9EA6;\n    font-size: clamp(11px, 3vw, 12px); font-weight: 700;\n    letter-spacing: 0.2em; text-transform: uppercase;\n  }\n  .kicker-2 { margin-top: 24px; }\n\n  .who { margin: 0; display: grid; grid-template-columns: 1fr; gap: 4px 0; }\n  .who dt {\n    color: #8A8A92; font-size: clamp(11px, 3vw, 12px); font-weight: 700;\n    letter-spacing: 0.2em; text-transform: uppercase; margin-top: 16px;\n  }\n  .who dd { margin: 4px 0 0; font-size: clamp(15px, 4.2vw, 18px); line-height: 1.5; color: #F3F3F1; }\n\n  /* numbered + labelled lists */\n  .four, .steps, .recap { margin: 20px 0 0; padding: 0; list-style: none; counter-reset: n; }\n  .three { margin: 20px 0 0; padding: 0; list-style: none; }\n  .four > li, .steps > li, .recap > li, .three > li {\n    position: relative; padding: 16px 0 0;\n    border-top: 1px solid #22222a; margin-top: 16px;\n  }\n  .four > li:first-child, .steps > li:first-child,\n  .recap > li:first-child, .three > li:first-child { border-top: none; margin-top: 0; padding-top: 0; }\n  .four > li::before, .steps > li::before, .recap > li::before {\n    counter-increment: n; content: counter(n, decimal-leading-zero);\n    display: block; color: #E2545C; font-weight: 700;\n    font-size: clamp(12px, 3.2vw, 13px); letter-spacing: 0.14em; margin-bottom: 6px;\n  }\n  .four > li > b, .steps > li > b, .recap > li > b, .three > li > b {\n    display: block; font-size: clamp(16px, 4.4vw, 19px); font-weight: 700;\n    letter-spacing: 0.02em; color: #F3F3F1;\n  }\n  .three > li > b { color: #E2545C; letter-spacing: 0.16em; text-transform: uppercase;\n    font-size: clamp(12px, 3.3vw, 14px); }\n  .four > li > span, .steps > li > span, .recap > li > span, .three > li > span {\n    display: block; margin-top: 6px; color: #9E9EA6;\n    font-size: clamp(14.5px, 4vw, 17px); line-height: 1.55; text-wrap: pretty;\n  }\n  .recap > li > em {\n    display: block; margin-top: 8px; font-style: normal; color: #E2545C;\n    font-weight: 700; font-size: clamp(14px, 3.8vw, 16px);\n  }\n\n  /* Risk list: the label, the risk, then the fix. The fix is what carries the\n     slide, so it gets the panel rather than a footnote. */\n  .risks { margin: 20px 0 0; padding: 0; list-style: none; }\n  .risks > li {\n    padding: 16px 0 0; border-top: 1px solid #22222a; margin-top: 18px;\n  }\n  .risks > li:first-child { border-top: none; margin-top: 0; padding-top: 0; }\n  .risks > li > i {\n    display: block; font-style: normal; color: #9C9CA2;\n    font-size: clamp(11px, 3vw, 12px); font-weight: 700;\n    letter-spacing: 0.2em; text-transform: uppercase;\n  }\n  .risks > li > b {\n    display: block; margin-top: 7px; color: #F3F3F1;\n    font-size: clamp(17px, 4.7vw, 20px); font-weight: 700; line-height: 1.3;\n    text-wrap: pretty;\n  }\n  .risks > li > span {\n    display: block; margin-top: 12px; padding: 13px 15px;\n    background: #1A1A1E; border: 1px solid #26262e; border-radius: 12px;\n    color: #9E9EA6; font-size: clamp(14.5px, 4vw, 17px); line-height: 1.55;\n    text-wrap: pretty;\n  }\n  .risks > li > span > em {\n    display: block; margin-bottom: 4px; font-style: normal; color: #E2545C;\n    font-size: clamp(11px, 3vw, 12px); font-weight: 700;\n    letter-spacing: 0.18em; text-transform: uppercase;\n  }\n  /* A gap we are not solving is not an achievement -- grey, not accent. */\n  .recap > li > em.grey { color: #9C9CA2; }\n\n  .panel {\n    margin: 26px 0 0; padding: clamp(18px, 4.5vw, 26px);\n    background: #1A1A1E; border: 1px solid #26262e; border-radius: 14px;\n  }\n  .panel > .kicker:first-child { margin-top: 0; }\n  .stat {\n    margin: 12px 0 0; color: #E2545C; font-weight: 700;\n    letter-spacing: -0.03em; line-height: 1;\n    font-size: clamp(40px, 13vw, 66px);\n  }\n  .stat-sm { font-size: clamp(30px, 9.5vw, 48px); margin-top: 24px; }\n  .stat-pre { margin: 12px 0 0; color: #9E9EA6; f 700 13px/1 Arial, Helvetica, sans-serif; letter-spacing: 0.06em;\n    white-space: nowrap; pointer-events: none;\n  }\n  body.mv-rotate-hint #mv-rotate { display: flex; }\n  #mv-rotate svg { width: 16px; height: 16px; flex: none; }\n\n  /* ── Fullscreen / present control ───────────────────────────────────── */\n  #mv-fs {\n    position: fixed; z-index: 40;\n    right: calc(14px + env(safe-area-inset-right));\n    top: calc(14px + env(safe-area-inset-top));\n    width: 44px; height: 44px; display: none;\n    align-items: center; justify-content: center;\n    border-radius: 12px; cursor: pointer;\n    background: rgba(30,30,34,0.78); border: 1px solid #313138;\n    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);\n    color: #F3F3F1; -webkit-tap-highlight-color: transparent;\n  }\n  body.mv-show-fs #mv-fs { display: flex; }\n  #mv-fs svg { width: 18px; height: 18px; }\n\n  /* ── Read-view entry point, shown over the deck on small screens ────── */\n  #mv-toread {\n    position: fixed; z-index: 40;\n    left: calc(14px + env(safe-area-inset-left));\n    top: calc(14px + env(safe-area-inset-top));\n    display: none;\n  }\n  body.mv-show-read #mv-toread { display: block; }\n\n  @media (prefers-reduced-motion: reduce) {\n    #mv * { animation: none !important; transition: none !important; }\n  }\n\n  /* First paint, before <deck-stage> has upgraded and the shell can set\n     .mv-on: a portrait phone gets the reading view straight away rather than\n     a letterboxed 16:9 slide that flips a moment later. The shell sets\n     `mv-ready` on <html> once it is driving that choice itself. */\n  @media (orientation: portrait) and (max-width: 900px) {\n    html:not(.mv-ready) #mv { display: block; }\n    html:not(.mv-ready) deck-stage { display: none !important; }\n  }\n<\/style>\n<\/helmet>\n\n<x-import component-from-global-scope=\"deck-stage\" from=\"1fd805ec-3320-4cee-aa8d-147c6eb868ea#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\">\n\n  <section data-label=\"Cover\" data-screen-label=\"01 Cover\" data-speaker-notes=\"Open here. Say the one line: this is a normal HTML deck, but anyone in the room can follow it on their own phone. Then hit L and show them the QR on the next beat.\" style=\"background:#161619; overflow:hidden; font-family:Arial, Helvetica, sans-serif; color:#F3F3F1;\">\n    <div class=\"amb\" style=\"position:absolute; inset:0; overflow:hidden; pointer-events:none;\">\n      <div style=\"position:absolute; width:1500px; height:1500px; left:-380px; top:-460px; border-radius:50%; background:radial-gradient(circle, #2B1F26 0%, rgba(43,31,38,0.42) 42%, rgba(22,22,25,0) 72%); animation:drift1 36s ease-in-out infinite;\"><\/div>\n      <div style=\"position:absolute; width:1400px; height:1400px; left:26%; bottom:-620px; border-radius:50%; background:radial-gradient(circle, #1B2028 0%, rgba(27,32,40,0.45) 44%, rgba(22,22,25,0) 74%); animation:drift2 48s ease-in-out infinite;\"><\/div>\n      <div style=\"position:absolute; width:900px; height:900px; left:36%; top:12%; border-radius:50%; background:radial-gradient(circle, rgba(226,84,92,0.12) 0%, rgba(226,84,92,0.04) 42%, rgba(22,22,25,0) 72%); animation:drift3 42s ease-in-out infinite;\"><\/div>\n      <div style=\"position:absolute; inset:0; background:radial-gradient(ellipse at 40% 45%, rgba(22,22,25,0) 40%, rgba(15,15,18,0.5) 80%, rgba(13,13,15,0.8) 100%);\"><\/div>\n    <\/div>\n\n    <div style=\"position:absolute; right:0; top:0; bottom:0; width:560px; box-sizing:border-box; background:linear-gradient(180deg, #1E1E22 0%, #1A1A1E 100%); display:flex; flex-direction:column; justify-content:center; align-items:flex-start; gap:22px; padding:0 72px;\">\n      <span data-anim=\"\" style=\"font-size:44px; line-height:1.18; font-weight:700; letter-spacing:-0.015em; color:#D24049; opacity:0; animation:riseIn 1.3s cubic-bezier(0.22,0.61,0.36,1) 0.5s both;\">One deck,<br>every screen<br>in the room<\/span>\n      <span data-anim=\"\" style=\"font-size:30px; font-weight:700; letter-spacing:0.22em; color:#F3F3F1; opacity:0; animation:riseIn 1.1s cubic-bezier(0.22,0.61,0.36,1) 0.7s both;\">~80 ms<\/span>\n      <span data-anim=\"\" style=\"font-size:22px; letter-spacing:0.14em; color:#9E9EA6; opacity:0; animation:fadeIn 1.4s ease-out 0.9s both;\">STAGE TO PHONE<\/span>\n    <\/div>\n\n    <div style=\"position:absolute; left:100px; top:0; bottom:0; width:1160px; display:flex; flex-direction:column; justify-content:center; gap:36px;\">\n      <span data-anim=\"\" style=\"font-size:26px; font-weight:700; letter-spacing:0.34em; color:#E2545C; opacity:0; animation:riseIn 1.1s cubic-bezier(0.22,0.61,0.36,1) 0.15s both;\">LIVE PRESENTATION SYSTEM<\/span>\n      <h1 data-anim=\"\" style=\"margin:0; font-size:104px; line-height:1.02; font-weight:700; letter-spacing:-0.03em; opacity:0; animation:riseIn 1.4s cubic-bezier(0.22,0.61,0.36,1) 0.3s both;\">\n        <span style=\"color:#F3F3F1; display:block;\">THE DECK THAT<\/span>\n        <span style=\"color:#E2545C; display:block;\">FOLLOWS YOU<\/span>\n      <\/h1>\n      <p data-anim=\"\" style=\"margin:0; max-width:980px; font-size:34px; line-height:1.5; color:#9E9EA6; text-wrap:pretty; opacity:0; animation:riseIn 1.2s cubic-bezier(0.22,0.61,0.36,1) 0.6s both;\">A normal HTML deck on a projector. Scan the code and it is also on your phone, on the slide I am on right now — and my phone is the remote.<\/p>\n      <div data-anim=\"\" style=\"height:1px; width:100%; max-width:1020px; background:linear-gradient(90deg, #313138 0%, rgba(49,49,56,0) 100%); transform-origin:left; opacity:0; animation:ruleGrow 1.4s cubic-bezier(0.22,0.61,0.36,1) 0.85s both;\"><\/div>\n      <div data-anim=\"\" style=\"display:flex; flex-direction:column; gap:12px; opacity:0; animation:fadeIn 1.5s ease-out 1s both;\">\n        <span style=\"font-size:22px; font-weight:700; letter-spacing:0.22em; color:#9C9CA2;\">TO GO LIVE<\/span>\n        <span style=\"font-size:30px; line-height:1.5; color:#F3F3F1;\">Press <b style=\"color:#E2545C;\">L<\/b> on this deck, then point a camera at the code that appears.<\/span>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section data-label=\"Three Roles\" data-screen-label=\"02 Three Roles\" data-speaker-notes=\"Three screens, three jobs. The laptop owns the truth. My phone drives it. Their phones follow it. Nobody installs anything - it is all one URL.\" style=\"background:#161619; overflow:hidden; font-family:Arial, Helvetica, sans-serif; color:#F3F3F1;\">\n    <div class=\"amb\" style=\"position:absolute; inset:0; overflow:hidden; pointer-events:none;\">\n      <div style=\"position:absolute; width:1400px; height:1400px; right:-420px; top:-520px; border-radius:50%; background:radial-gradient(circle, #1F1F25 0%, rgba(31,31,37,0.45) 44%, rgba(22,22,25,0) 74%); animation:drift2 44s ease-in-out infinite;\"><\/div>\n      <div style=\"position:absolute; width:1200px; height:1200px; left:-340px; bottom:-500px; border-radius:50%; background:radial-gradient(circle, rgba(226,84,92,0.09) 0%, rgba(226,84,92,0.03) 42%, rgba(22,22,25,0) 72%); animation:drift1 52s ease-in-out infinite;\"><\/div>\n      <div style=\"position:absolute; inset:0; background:radial-gradient(ellipse at 50% 40%, rgba(22,22,25,0) 45%, rgba(14,14,17,0.5) 85%, rgba(13,13,15,0.75) 100%);\"><\/div>\n    <\/div>\n\n    <div style=\"position:absolute; inset:0; padding:96px 100px 84px; display:flex; flex-direction:column;\">\n      <span data-anim=\"\" style=\"font-size:26px; font-weight:700; letter-spacing:0.38em; color:#E2545C; opacity:0; animation:riseIn 1s cubic-bezier(0.22,0.61,0.36,1) 0.1s both;\">HOW IT WORKS<\/span>\n      <h2 data-anim=\"\" style=\"margin:22px 0 10px; font-size:74px; line-height:1.08; font-weight:700; letter-spacing:-0.025em; color:#F3F3F1; opacity:0; animation:riseIn 1.2s cubic-bezier(0.22,0.61,0.36,1) 0.25s both;\">Three Screens, Three Jobs<\/h2>\n      <div style=\"display:grid; grid-template-columns:repeat(3, 1fr); gap:34px; margin-top:54px;\">\n        <div data-anim=\"\" style=\"background:#1C1C21; border:1px solid #2B2B33; border-radius:20px; padding:44px 40px; opacity:0; animation:riseIn 1.1s cubic-bezier(0.22,0.61,0.36,1) 0.45s both;\">\n          <span style=\"font-size:22px; font-weight:700; letter-spacing:0.2em; color:#E2545C;\">STAGE<\/span>\n          <p style=\"margin:20px 0 0; font-size:38px; font-weight:700; line-height:1.2; color:#F3F3F1;\">The laptop on the projector<\/p>\n          <p style=\"margin:20px 0 0; font-size:27px; line-height:1.5; color:#9E9EA6;\">Owns the current slide. Hands out both links as codes on screen.<\/p>\n        <\/div>\n        <div data-anim=\"\" style=\"background:#1C1C21; border:1px solid #2B2B33; border-radius:20px; padding:44px 40px; opacity:0; animation:riseIn 1.1s cubic-bezier(0.22,0.61,0.36,1) 0.6s both;\">\n          <span style=\"font-size:22px; font-weight:700; letter-spacing:0.2em; color:#E2545C;\">REMOTE<\/span>\n          <p style=\"margin:20px 0 0; font-size:38px; font-weight:700; line-height:1.2; color:#F3F3F1;\">My phone, in my hand<\/p>\n          <p style=\"margin:20px 0 0; font-size:27px; line-height:1.5; color:#9E9EA6;\">Next and back, my notes, a timer, and a pointer. Nobody else can drive.<\/p>\n        <\/div>\n        <div data-anim=\"\" style=\"background:#1C1C21; border:1px solid #2B2B33; border-radius:20px; padding:44px 40px; opacity:0; animation:riseIn 1.1s cubic-bezier(0.22,0.61,0.36,1) 0.75s both;\">\n          <span style=\"font-size:22px; font-weight:700; letter-spacing:0.2em; color:#E2545C;\">AUDIENCE<\/span>\n          <p style=\"margin:20px 0 0; font-size:38px; font-weight:700; line-height:1.2; color:#F3F3F1;\">Everyone else's phones<\/p>\n          <p style=\"margin:20px 0 0; font-size:27px; line-height:1.5; color:#9E9EA6;\">The same slide, close up and readable, without squinting at the wall.<\/p>\n        <\/div>\n      <\/div>\n      <p data-anim=\"\" style=\"margin:52px 0 0; font-size:28px; line-height:1.5; color:#8A8A92; opacity:0; animation:fadeIn 1.4s ease-out 0.95s both;\">Nothing to install. Every role is the same web page, opened at a different link.<\/p>\n    <\/div>\n  <\/section>\n\n  <section data-label=\"Scan to Follow\" data-screen-label=\"03 Scan to Follow\" data-speaker-notes=\"This is the moment to actually do it. Press L, let them scan, watch the phone count go up on the panel. Then advance a slide and let them see their own screens move.\" style=\"background:#161619; overflow:hidden; font-family:Arial, Helvetica, sans-serif; color:#F3F3F1;\">\n    <div class=\"amb\" style=\"position:absolute; inset:0; overflow:hidden; pointer-events:none;\">\n      <div style=\"position:absolute; width:1500px; height:1500px; left:-420px; bottom:-560px; border-radius:50%; background:radial-gradient(circle, #241B20 0%, rgba(36,27,32,0.42) 42%, rgba(22,22,25,0) 72%); animation:drift3 40s ease-in-out infinite;\"><\/div>\n      <div style=\"position:absolute; width:1100px; height:1100px; right:-260px; top:-300px; border-radius:50%; background:radial-gradient(circle, rgba(226,84,92,0.10) 0%, rgba(226,84,92,0.03) 42%, rgba(22,22,25,0) 72%); animation:drift1 46s ease-in-out infinite;\"><\/div>\n      <div style=\"position:absolute; inset:0; background:radial-gradient(ellipse at 45% 45%, rgba(22,22,25,0) 45%, rgba(14,14,17,0.5) 85%, rgba(13,13,15,0.78) 100%);\"><\/div>\n    <\/div>\n\n    <div style=\"position:absolute; inset:0; padding:96px 100px 84px; display:flex; flex-direction:column;\">\n      <span data-anim=\"\" style=\"font-size:26px; font-weight:700; letter-spacing:0.38em; color:#E2545C; opacity:0; animation:riseIn 1s cubic-bezier(0.22,0.61,0.36,1) 0.1s both;\">THE ONE STEP<\/span>\n      <h2 data-anim=\"\" style=\"margin:22px 0 10px; font-size:74px; line-height:1.08; font-weight:700; letter-spacing:-0.025em; color:#F3F3F1; opacity:0; animation:riseIn 1.2s cubic-bezier(0.22,0.61,0.36,1) 0.25s both;\">Scan Once, Follow Everything<\/h2>\n      <p data-anim=\"\" style=\"margin:26px 0 0; max-width:1300px; font-size:34px; line-height:1.5; color:#9E9EA6; opacity:0; animation:riseIn 1.1s cubic-bezier(0.22,0.61,0.36,1) 0.4s both;\">A four-character room code and a camera. From then on, every time I move, their screen moves.<\/p>\n      <div style=\"display:grid; grid-template-columns:repeat(3, 1fr); gap:30px; margin-top:58px;\">\n        <div data-anim=\"\" style=\"opacity:0; animation:riseIn 1.1s cubic-bezier(0.22,0.61,0.36,1) 0.55s both;\">\n          <span style=\"display:block; font-size:72px; font-weight:700; color:#E2545C; line-height:1;\">1<\/span>\n          <p style=\"margin:22px 0 0; font-size:32px; line-height:1.45; color:#F3F3F1;\">I press <b>L<\/b>. Two codes appear on the projector.<\/p>\n        <\/div>\n        <div data-anim=\"\" style=\"opacity:0; animation:riseIn 1.1s cubic-bezier(0.22,0.61,0.36,1) 0.7s both;\">\n          <span style=\"display:block; font-size:72px; font-weight:700; color:#E2545C; line-height:1;\">2<\/span>\n          <p style=\"margin:22px 0 0; font-size:32px; line-height:1.45; color:#F3F3F1;\">They point a camera at the left one and tap the link.<\/p>\n        <\/div>\n        <div data-anim=\"\" style=\"opacity:0; animation:riseIn 1.1s cubic-bezier(0.22,0.61,0.36,1) 0.85s both;\">\n          <span style=\"display:block; font-size:72px; font-weight:700; color:#E2545C; line-height:1;\">3<\/span>\n          <p style=\"margin:22px 0 0; font-size:32px; line-height:1.45; color:#F3F3F1;\">That is it. No app, no sign-in, no typing a long URL.<\/p>\n        <\/div>\n      <\/div>\n      <div data-anim=\"\" style=\"margin-top:auto; display:flex; align-items:center; gap:22px; opacity:0; animation:fadeIn 1.5s ease-out 1.05s both;\">\n        <span style=\"display:inline-block; width:12px; height:12px; border-radius:50%; background:#3C9E5A;\"><\/span>\n        <span style=\"font-size:28px; color:#8A8A92;\">The panel shows how many phones are in the room, live.<\/span>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section data-label=\"The Remote\" data-screen-label=\"04 The Remote\" data-speaker-notes=\"Hold the phone up. Point out that the notes are the same data-speaker-notes already in the slide file - you write them once. The pointer pad is the thing people do not expect.\" style=\"background:#161619; overflow:hidden; font-family:Arial, Helvetica, sans-serif; color:#F3F3F1;\">\n    <div class=\"amb\" style=\"position:absolute; inset:0; overflow:hidden; pointer-events:none;\">\n      <div style=\"position:absolute; width:1300px; height:1300px; left:-300px; top:-420px; border-radius:50%; background:radial-gradient(circle, #1F1F25 0%, rgba(31,31,37,0.45) 44%, rgba(22,22,25,0) 74%); animation:drift1 44s ease-in-out infinite;\"><\/div>\n      <div style=\"position:absolute; width:1200px; height:1200px; right:-320px; bottom:-480px; border-radius:50%; background:radial-gradient(circle, rgba(226,84,92,0.09) 0%, rgba(226,84,92,0.03) 42%, rgba(22,22,25,0) 72%); animation:drift2 50s ease-in-out infinite;\"><\/div>\n      <div style=\"position:absolute; inset:0; background:radial-gradient(ellipse at 50% 42%, rgba(22,22,25,0) 45%, rgba(14,14,17,0.5) 85%, rgba(13,13,15,0.75) 100%);\"><\/div>\n    <\/div>\n\n    <div style=\"position:absolute; inset:0; padding:96px 100px 84px; display:flex; flex-direction:column;\">\n      <span data-anim=\"\" style=\"font-size:26px; font-weight:700; letter-spacing:0.38em; color:#E2545C; opacity:0; animation:riseIn 1s cubic-bezier(0.22,0.61,0.36,1) 0.1s both;\">IN MY HAND<\/span>\n      <h2 data-anim=\"\" style=\"margin:22px 0 10px; font-size:74px; line-height:1.08; font-weight:700; letter-spacing:-0.025em; color:#F3F3F1; opacity:0; animation:riseIn 1.2s cubic-bezier(0.22,0.61,0.36,1) 0.25s both;\">My Phone Is the Clicker<\/h2>\n      <p data-anim=\"\" style=\"margin:26px 0 0; max-width:1320px; font-size:34px; line-height:1.5; color:#9E9EA6; opacity:0; animation:riseIn 1.1s cubic-bezier(0.22,0.61,0.36,1) 0.4s both;\">I never have to stand next to the laptop again. Everything a presenter view gives me, on the device already in my hand.<\/p>\n      <div style=\"display:grid; grid-template-columns:repeat(2, 1fr); gap:30px 60px; margin-top:54px;\">\n        <div data-anim=\"\" style=\"display:flex; gap:26px; align-items:flex-start; opacity:0; animation:riseIn 1s cubic-bezier(0.22,0.61,0.36,1) 0.55s both;\">\n          <span style=\"font-size:30px; color:#E2545C; font-weight:700; line-height:1.3;\">&#9679;<\/span>\n          <p style=\"margin:0; font-size:32px; line-height:1.45;\"><b style=\"color:#F3F3F1;\">My notes, in full size.<\/b> <span style=\"color:#9E9EA6;\">The ones already written into the slide.<\/span><\/p>\n        <\/div>\n        <div data-anim=\"\" style=\"display:flex; gap:26px; align-items:flex-start; opacity:0; animation:riseIn 1s cubic-bezier(0.22,0.61,0.36,1) 0.65s both;\">\n          <span style=\"font-size:30px; color:#E2545C; font-weight:700; line-height:1.3;\">&#9679;<\/span>\n          <p style=\"margin:0; font-size:32px; line-height:1.45;\"><b style=\"color:#F3F3F1;\">What is coming next.<\/b> <span style=\"color:#9E9EA6;\">So a transition never catches me out.<\/span><\/p>\n        <\/div>\n        <div data-anim=\"\" style=\"display:flex; gap:26px; align-items:flex-start; opacity:0; animation:riseIn 1s cubic-bezier(0.22,0.61,0.36,1) 0.75s both;\">\n          <span style=\"font-size:30px; color:#E2545C; font-weight:700; line-height:1.3;\">&#9679;<\/span>\n          <p style=\"margin:0; font-size:32px; line-height:1.45;\"><b style=\"color:#F3F3F1;\">A running clock.<\/b> <span style=\"color:#9E9EA6;\">Started the moment the deck went live.<\/span><\/p>\n        <\/div>\n        <div data-anim=\"\" style=\"display:flex; gap:26px; align-items:flex-start; opacity:0; animation:riseIn 1s cubic-bezier(0.22,0.61,0.36,1) 0.85s both;\">\n          <span style=\"font-size:30px; color:#E2545C; font-weight:700; line-height:1.3;\">&#9679;<\/span>\n          <p style=\"margin:0; font-size:32px; line-height:1.45;\"><b style=\"color:#F3F3F1;\">Drag to point.<\/b> <span style=\"color:#9E9EA6;\">A dot lands on the projected slide, where I aimed.<\/span><\/p>\n        <\/div>\n      <\/div>\n      <p data-anim=\"\" style=\"margin:auto 0 0; font-size:28px; line-height:1.5; color:#8A8A92; opacity:0; animation:fadeIn 1.4s ease-out 1s both;\">Only the phone that scanned my private code can move the deck. A room code alone does nothing.<\/p>\n    <\/div>\n  <\/section>\n\n  <section data-label=\"Audience Modes\" data-screen-label=\"05 Audience Modes\" data-speaker-notes=\"This is the one people ask about: can they read ahead? Answer: that is your call, and you can change it mid-talk. Switch it live here so they see the buttons do something.\" style=\"background:#161619; overflow:hidden; font-family:Arial, Helvetica, sans-serif; color:#F3F3F1;\">\n    <div class=\"amb\" style=\"position:absolute; inset:0; overflow:hidden; pointer-events:none;\">\n      <div style=\"position:absolute; width:1400px; height:1400px; right:-380px; bottom:-520px; border-radius:50%; background:radial-gradient(circle, #231A1E 0%, rgba(35,26,30,0.42) 44%, rgba(22,22,25,0) 74%); animation:drift2 46s ease-in-out infinite;\"><\/div>\n      <div style=\"position:absolute; width:1000px; height:1000px; left:-220px; top:-260px; border-radius:50%; background:radial-gradient(circle, rgba(226,84,92,0.09) 0%, rgba(226,84,92,0.03) 42%, rgba(22,22,25,0) 72%); animation:drift3 50s ease-in-out infinite;\"><\/div>\n      <div style=\"position:absolute; inset:0; background:radial-gradient(ellipse at 50% 45%, rgba(22,22,25,0) 45%, rgba(14,14,17,0.5) 85%, rgba(13,13,15,0.75) 100%);\"><\/div>\n    <\/div>\n\n    <div style=\"position:absolute; inset:0; padding:96px 100px 84px; display:flex; flex-direction:column;\">\n      <span data-anim=\"\" style=\"font-size:26px; font-weight:700; letter-spacing:0.38em; color:#E2545C; opacity:0; animation:riseIn 1s cubic-bezier(0.22,0.61,0.36,1) 0.1s both;\">YOUR CALL<\/span>\n      <h2 data-anim=\"\" style=\"margin:22px 0 10px; font-size:74px; line-height:1.08; font-weight:700; letter-spacing:-0.025em; color:#F3F3F1; opacity:0; animation:riseIn 1.2s cubic-bezier(0.22,0.61,0.36,1) 0.25s both;\">How Much They Get to Wander<\/h2>\n      <div style=\"display:grid; grid-template-columns:repeat(3, 1fr); gap:34px; margin-top:56px;\">\n        <div data-anim=\"\" style=\"background:#1C1C21; border:1px solid #2B2B33; border-radius:20px; padding:42px 38px; opacity:0; animation:riseIn 1.1s cubic-bezier(0.22,0.61,0.36,1) 0.45s both;\">\n          <span style=\"font-size:22px; font-weight:700; letter-spacing:0.2em; color:#E2545C;\">LOCKED<\/span>\n          <p style=\"margin:18px 0 0; font-size:36px; font-weight:700; line-height:1.2; color:#F3F3F1;\">They watch, only<\/p>\n          <p style=\"margin:18px 0 0; font-size:26px; line-height:1.5; color:#9E9EA6;\">Swiping does nothing. Use it when the order of the argument matters.<\/p>\n        <\/div>\n        <div data-anim=\"\" style=\"background:#1C1C21; border:1px solid #E2545C; border-radius:20px; padding:42px 38px; opacity:0; animation:riseIn 1.1s cubic-bezier(0.22,0.61,0.36,1) 0.6s both;\">\n          <span style=\"font-size:22px; font-weight:700; letter-spacing:0.2em; color:#E2545C;\">FOLLOW &middot; DEFAULT<\/span>\n          <p style=\"margin:18px 0 0; font-size:36px; font-weight:700; line-height:1.2; color:#F3F3F1;\">They follow, but may stray<\/p>\n          <p style=\"margin:18px 0 0; font-size:26px; line-height:1.5; color:#9E9EA6;\">Wander back a slide to re-read, then tap one button to catch up.<\/p>\n        <\/div>\n        <div data-anim=\"\" style=\"background:#1C1C21; border:1px solid #2B2B33; border-radius:20px; padding:42px 38px; opacity:0; animation:riseIn 1.1s cubic-bezier(0.22,0.61,0.36,1) 0.75s both;\">\n          <span style=\"font-size:22px; font-weight:700; letter-spacing:0.2em; color:#E2545C;\">OPEN<\/span>\n          <p style=\"margin:18px 0 0; font-size:36px; font-weight:700; line-height:1.2; color:#F3F3F1;\">The whole deck, theirs<\/p>\n          <p style=\"margin:18px 0 0; font-size:26px; line-height:1.5; color:#9E9EA6;\">For a workshop, or the moment you stop talking and they start reading.<\/p>\n        <\/div>\n      <\/div>\n      <p data-anim=\"\" style=\"margin:auto 0 0; font-size:28px; line-height:1.5; color:#8A8A92; opacity:0; animation:fadeIn 1.4s ease-out 0.95s both;\">Switch between them mid-sentence. There is also a quiet <b style=\"color:#F3F3F1;\">\"I'm lost\"<\/b> tap that only I see.<\/p>\n    <\/div>\n  <\/section>\n\n  <section data-label=\"Ready Before You Start\" data-screen-label=\"06 Ready\" data-speaker-notes=\"Close on the boring promise that actually matters: it is fully loaded before it says LIVE, and if the wifi dies the deck still works as a plain deck. Then thank them.\" style=\"background:#161619; overflow:hidden; font-family:Arial, Helvetica, sans-serif; color:#F3F3F1;\">\n    <div class=\"amb\" style=\"position:absolute; inset:0; overflow:hidden; pointer-events:none;\">\n      <div style=\"position:absolute; width:1500px; height:1500px; left:-400px; top:-500px; border-radius:50%; background:radial-gradient(circle, #2B1F26 0%, rgba(43,31,38,0.40) 42%, rgba(22,22,25,0) 72%); animation:drift1 38s ease-in-out infinite;\"><\/div>\n      <div style=\"position:absolute; width:1300px; height:1300px; right:-340px; bottom:-500px; border-radius:50%; background:radial-gradient(circle, #1B2028 0%, rgba(27,32,40,0.45) 44%, rgba(22,22,25,0) 74%); animation:drift2 50s ease-in-out infinite;\"><\/div>\n      <div style=\"position:absolute; inset:0; background:radial-gradient(ellipse at 45% 45%, rgba(22,22,25,0) 45%, rgba(14,14,17,0.5) 85%, rgba(13,13,15,0.8) 100%);\"><\/div>\n    <\/div>\n\n    <div style=\"position:absolute; inset:0; padding:96px 100px 84px; display:flex; flex-direction:column;\">\n      <span data-anim=\"\" style=\"font-size:26px; font-weight:700; letter-spacing:0.38em; color:#E2545C; opacity:0; animation:riseIn 1s cubic-bezier(0.22,0.61,0.36,1) 0.1s both;\">THE BORING PART THAT MATTERS<\/span>\n      <h2 data-anim=\"\" style=\"margin:22px 0 10px; font-size:74px; line-height:1.08; font-weight:700; letter-spacing:-0.025em; color:#F3F3F1; opacity:0; animation:riseIn 1.2s cubic-bezier(0.22,0.61,0.36,1) 0.25s both;\">Nothing Loads Mid-Sentence<\/h2>\n      <p data-anim=\"\" style=\"margin:26px 0 0; max-width:1340px; font-size:34px; line-height:1.5; color:#9E9EA6; opacity:0; animation:riseIn 1.1s cubic-bezier(0.22,0.61,0.36,1) 0.4s both;\">Before the deck will call itself live, it goes through every slide behind a cover: fonts resolved, images decoded, each slide actually drawn once, the screen locked awake, the connection joined.<\/p>\n      <div style=\"display:flex; gap:28px; margin-top:52px; flex-wrap:wrap;\">\n        <span data-anim=\"\" style=\"font-size:26px; letter-spacing:0.04em; color:#F3F3F1; background:#1C1C21; border:1px solid #2B2B33; border-radius:999px; padding:16px 30px; opacity:0; animation:fadeIn 1s ease-out 0.55s both;\">Fonts ready<\/span>\n        <span data-anim=\"\" style=\"font-size:26px; letter-spacing:0.04em; color:#F3F3F1; background:#1C1C21; border:1px solid #2B2B33; border-radius:999px; padding:16px 30px; opacity:0; animation:fadeIn 1s ease-out 0.65s both;\">Images decoded<\/span>\n        <span data-anim=\"\" style=\"font-size:26px; letter-spacing:0.04em; color:#F3F3F1; background:#1C1C21; border:1px solid #2B2B33; border-radius:999px; padding:16px 30px; opacity:0; animation:fadeIn 1s ease-out 0.75s both;\">Every slide drawn<\/span>\n        <span data-anim=\"\" style=\"font-size:26px; letter-spacing:0.04em; color:#F3F3F1; background:#1C1C21; border:1px solid #2B2B33; border-radius:999px; padding:16px 30px; opacity:0; animation:fadeIn 1s ease-out 0.85s both;\">Screen kept awake<\/span>\n        <span data-anim=\"\" style=\"font-size:26px; letter-spacing:0.04em; color:#F3F3F1; background:#1C1C21; border:1px solid #2B2B33; border-radius:999px; padding:16px 30px; opacity:0; animation:fadeIn 1s ease-out 0.95s both;\">Room joined<\/span>\n      <\/div>\n      <div data-anim=\"\" style=\"margin-top:auto; opacity:0; animation:riseIn 1.2s cubic-bezier(0.22,0.61,0.36,1) 1.05s both;\">\n        <div style=\"height:1px; width:100%; max-width:1020px; background:linear-gradient(90deg, #313138 0%, rgba(49,49,56,0) 100%); margin-bottom:34px;\"><\/div>\n        <p style=\"margin:0; font-size:36px; line-height:1.45; color:#F3F3F1; max-width:1400px;\">And if the wifi gives out, the sync quietly stops and the deck keeps working like any other deck. <b style=\"color:#E2545C;\">It can never take the presentation down with it.<\/b><\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n\n<\/x-import>\n\n<div id=\"mv\" aria-label=\"Readable version\">\n  <div class=\"mv-amb\" aria-hidden=\"true\"><i><\/i><i><\/i><\/div>\n\n  <header class=\"mv-bar\">\n    <button type=\"button\" id=\"mv-jump\" class=\"mv-jump\" aria-expanded=\"false\" aria-controls=\"mv-index\">\n      <i class=\"mv-jump-n\">01<\/i>\n      <span class=\"mv-jump-t\">Cover<\/span>\n      <svg class=\"mv-jump-c\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"/><\/svg>\n    <\/button>\n    <button type=\"button\" id=\"mv-toslides\" class=\"mv-btn\">Slides<\/button>\n  <\/header>\n\n  <nav id=\"mv-index\" aria-label=\"Sections\"><\/nav>\n\n  <main class=\"mv-wrap\">\n\n    <!-- data-slide pins each card to its artboard, so a phone following the\n         room lands on the right one even if the two files drift apart. -->\n    <article data-nav=\"Cover\" data-slide=\"0\" class=\"mv-card mv-hero\">\n      <span class=\"eyebrow\">Live presentation system<\/span>\n      <h1 class=\"mv-h1\">The Deck That<br><em>Follows You<\/em><\/h1>\n      <p class=\"lead\">A normal HTML deck on a projector. Scan the code and it is also on your phone, on the slide the presenter is on right now — and their phone is the remote.<\/p>\n      <div class=\"rule\"><\/div>\n      <dl class=\"who\">\n        <dt>To go live<\/dt><dd>Press <b>L<\/b> on the deck, then point a camera at the code that appears.<\/dd>\n        <dt>Stage to phone<\/dt><dd>About 80 milliseconds.<\/dd>\n      <\/dl>\n    <\/article>\n\n    <article data-nav=\"Three Roles\" data-slide=\"1\" class=\"mv-card\">\n      <span class=\"eyebrow\">How it works<\/span>\n      <h2 class=\"mv-h2\">Three Screens, Three Jobs<\/h2>\n      <ul class=\"three\">\n        <li><b>Stage<\/b><span>The laptop on the projector. It owns the current slide and hands out both links as codes on screen.<\/span><\/li>\n        <li><b>Remote<\/b><span>The presenter's own phone. Next and back, their notes, a timer and a pointer — and nobody else can drive.<\/span><\/li>\n        <li><b>Audience<\/b><span>Everyone else's phones. The same slide, close up and readable, without squinting at the wall.<\/span><\/li>\n      <\/ul>\n      <p class=\"src\">Nothing to install. Every role is the same web page, opened at a different link.<\/p>\n    <\/article>\n\n    <article data-nav=\"Scan to Follow\" data-slide=\"2\" class=\"mv-card\">\n      <span class=\"eyebrow\">The one step<\/span>\n      <h2 class=\"mv-h2\">Scan Once, Follow Everything<\/h2>\n      <p class=\"lead\">A four-character room code and a camera. From then on, every time the presenter moves, your screen moves.<\/p>\n      <ol class=\"four\">\n        <li><b>They press L<\/b><span>Two codes appear on the projector — one for the room, one private.<\/span><\/li>\n        <li><b>You scan the left one<\/b><span>Point a camera at it and tap the link that pops up.<\/span><\/li>\n        <li><b>That is it<\/b><span>No app, no sign-in, no typing out a long address.<\/span><\/li>\n      <\/ol>\n      <p class=\"src\">The presenter's panel shows how many phones are in the room, live.<\/p>\n    <\/article>\n\n    <article data-nav=\"The Remote\" data-slide=\"3\" class=\"mv-card\">\n      <span class=\"eyebrow\">In my hand<\/span>\n      <h2 class=\"mv-h2\">My Phone Is the Clicker<\/h2>\n      <p class=\"lead\">No more standing next to the laptop. Everything a presenter view gives you, on the device already in your hand.<\/p>\n      <ul class=\"three\">\n        <li><b>My notes, in full size<\/b><span>The same notes already written into the slide — you write them once.<\/span><\/li>\n        <li><b>What is coming next<\/b><span>The next slide's title, so a transition never catches you out.<\/span><\/li>\n        <li><b>A running clock<\/b><span>Started the moment the deck went live, not when you opened the file.<\/span><\/li>\n        <li><b>Drag to point<\/b><span>A dot lands on the projected slide, exactly where you aimed.<\/span><\/li>\n      <\/ul>\n      <p class=\"src\">Only the phone that scanned the private code can move the deck. A room code on its own does nothing.<\/p>\n    <\/article>\n\n    <article data-nav=\"Audience Modes\" data-slide=\"4\" class=\"mv-card\">\n      <span class=\"eyebrow\">Your call<\/span>\n      <h2 class=\"mv-h2\">How Much They Get to Wander<\/h2>\n      <ul class=\"three\">\n        <li><b>Locked<\/b><span>They watch, only. Swiping does nothing. For when the order of the argument matters.<\/span><\/li>\n        <li><b>Follow — the default<\/b><span>They follow, but may stray back a slide to re-read, then tap one button to catch up.<\/span><\/li>\n        <li><b>Open<\/b><span>The whole deck is theirs. For a workshop, or the moment you stop talking and they start reading.<\/span><\/li>\n      <\/ul>\n      <p class=\"src\">Switch between them mid-sentence. There is also a quiet \"I'm lost\" tap that only the presenter sees.<\/p>\n    <\/article>\n\n    <article data-nav=\"Ready Before You Start\" data-slide=\"5\" class=\"mv-card mv-end\">\n      <span class=\"eyebrow\">The boring part that matters<\/span>\n      <h2 class=\"mv-h2\">Nothing Loads Mid-Sentence<\/h2>\n      <p class=\"lead\">Before the deck will call itself live it goes through every slide behind a cover: fonts resolved, images decoded, each slide actually drawn once, the screen locked awake, the connection joined.<\/p>\n      <p class=\"lead\">And if the wifi gives out, the sync quietly stops and the deck keeps working like any other deck. It can never take the presentation down with it.<\/p>\n      <h2 class=\"mv-h2 mv-thanks\">Thank you<\/h2>\n    <\/article>\n\n  <\/main>\n<\/div>\n\n\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    // Replay a slide's entrance build each time it becomes active.\n    this._onSlideChange = (e) => {\n      const slide = e.detail && e.detail.slide;\n      if (!slide) return;\n      slide.querySelectorAll('[data-anim]').forEach((el) => {\n        [el, ...el.querySelectorAll('*')].forEach((n) => {\n          if (!n.getAnimations) return;\n          n.getAnimations().forEach((a) => {\n            const inf = a.effect && a.effect.getTiming && a.effect.getTiming().iterations === Infinity;\n            if (inf) return;\n            try { a.cancel(); a.play(); } catch (err) {}\n          });\n        });\n      });\n    };\n    document.addEventListener('slidechange', this._onSlideChange);\n    this._mountGlow();\n    this._mountResponsive();\n  }\n\n  /* ── Pointer glow ───────────────────────────────────────────────────────\n     The original bound `pointerdown` too, so on a phone one tap parked a\n     permanent 900px halo on screen; it is a mouse effect, so it is now\n     gated to fine pointers and off under prefers-reduced-motion.\n\n     The look is unchanged on desktop. `mix-blend-mode: screen` is what\n     blooms the white headline instead of tinting it pink, and it is a cheap\n     fragment op on any GPU -- but on a machine falling back to software\n     compositing it is the single most expensive thing on the page (measured\n     59 -> 29fps, and no cheaper at any size or update rate). So instead of\n     trading the effect away for everyone, the first burst of pointer motion\n     is timed: if frames are actually landing below ~42fps the blend steps\n     down to `normal`, which costs almost nothing, and the verdict is\n     remembered. Capable machines keep the bloom; weak ones stop stuttering. */\n  _mountGlow() {\n    if (!matchMedia('(pointer: fine)').matches) return;\n    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n\n    const glow = document.createElement('div');\n    glow.id = 'dc-glow';\n    glow.setAttribute('aria-hidden', 'true');\n    glow.style.cssText = [\n      'position:fixed', 'left:0', 'top:0', 'width:900px', 'height:900px',\n      'margin:-450px 0 0 -450px', 'border-radius:50%', 'pointer-events:none',\n      'z-index:2147482000', 'mix-blend-mode:screen', 'opacity:0',\n      'transition:opacity 700ms ease-out',\n      'background:radial-gradient(circle, rgba(226,84,92,0.16) 0%, rgba(226,84,92,0.07) 26%, rgba(155,160,180,0.035) 48%, rgba(0,0,0,0) 68%)'\n    ].join(';');\n    document.body.appendChild(glow);\n    this._glow = glow;\n\n    const LITE = 'dc-glow-lite';\n    let lite = false;\n    try { lite = localStorage.getItem(LITE) === '1'; } catch (e) {}\n    if (lite) glow.style.mixBlendMode = 'normal';\n\n    // Frame-cost probe: only samples while the pointer is genuinely moving,\n    // discards a run the user cut short, and gives up after three rounds.\n    let probing = false, settled = lite, rounds = 0, samples = [], prev = 0, moveAt = 0;\n    const step = (now) => {\n      if (!probing) return;\n      if (now - moveAt > 140) {                 // motion stopped: discard run\n        probing = false; samples = []; prev = 0; return;\n      }\n      if (prev) samples.push(now - prev);\n      prev = now;\n      if (samples.length < 40) { requestAnimationFrame(step); return; }\n      probing = false; prev = 0;\n      samples.sort((a, b) => a  class=\"lv-rnext\"><\/div>' +\n    '<\/div>' +\n    '<div class=\"lv-rpad\">' +\n      '<button class=\"lv-rprev\">Back<\/button>' +\n      '<button class=\"lv-rblank\">Blank<\/button>' +\n      '<button class=\"lv-rnextbtn\">Next<\/button>' +\n    '<\/div>';\n  document.body.appendChild(ui);\n  document.body.style.overflow = 'hidden';\n\n  var q = function (s) { return ui.querySelector(s); };\n  var room = new Room(code, 'remote', onEvent, function (s) { q('.lv-rstatus').textContent = s + ' · ' + BUILD; });\n  room.connect();\n  wakeLock();\n\n  function cmd(k, i) { room.cast('cmd', { k: k, i: i, tok: tok }); }\n  q('.lv-rprev').addEventListener('click', function () { cmd('prev'); });\n  q('.lv-rnextbtn').addEventListener('click', function () { cmd('next'); });\n  q('.lv-rblank').addEventListener('click', function () { cmd('blank'); });\n\n  /* Pointer pad: normalised coordinates so the dot lands in the same place\n     whatever the projector's aspect ratio. */\n  var pad = q('.lv-rtrack');\n  function pt(e, on) {\n    var r = pad.getBoundingClientRect();\n    var t = e.touches && e.touches[0] ? e.touches[0] : e;\n    room.cast('ptr', { on: on, tok: tok,\n      x: Math.min(1, Math.max(0, (t.clientX - r.left) / r.width)),\n      y: Math.min(1, Math.max(0, (t.clientY - r.top) / r.height)) });\n  }\n  ['touchstart', 'touchmove'].forEach(function (ev) {\n    pad.addEventListener(ev, function (e) { e.preventDefault(); pad.classList.add('on'); pt(e, true); }, { passive: false });\n  });\n  ['touchend', 'touchcancel'].forEach(function (ev) {\n    pad.addEventListener(ev, function () { pad.classList.remove('on'); room.cast('ptr', { on: false, tok: tok }); });\n  });\n\n  /* Ask until answered. One `hello` is a single point of failure: if it is\n     sent while the stage is mid-preflight, or lost, or the stage reloads, the\n     remote would stay blank with no way back. */\n  var gotState = false;\n  function helloLoop() {\n    if (gotState) return;\n    room.cast('hello', {});\n    setTimeout(helloLoop, 1500);\n  }\n\n  function render() {\n    if (!st || st.n == null) return;\n    /* While the stage is still warming, its index is wherever the preflight\n       walk has got to -- not a place the presenter is. Say so instead of\n       showing a number that is about to jump. */\n    if (st.ready === false) {\n      q('.lv-rpos').textContent = '— / ' + st.n;\n      q('.lv-rlabel').textContent = 'Stage is preparing';\n      q('.lv-rnotes').textContent = 'The deck is loading itself in. Controls light up in a moment.';\n      q('.lv-rnext').textContent = '';\n      return;\n    }\n    q('.lv-rpos').textContent = (st.i + 1) + ' / ' + st.n;\n    q('.lv-rlabel').textContent = labelFor(st.i);\n    q('.lv-rnotes').textContent = notesFor(st.i) || 'No notes on this slide.';\n    q('.lv-rnext').textContent = (st.i + 1 < st.n) ? ('NEXT · ' + labelFor(st.i + 1)) : 'Last slide.';\n  }\n\n  /* The remote never waits for deck-stage, so on a slow phone the first state\n     can land before the slides exist and the notes would read as empty for the\n     rest of the talk. Re-render once they show up. */\n  (function awaitSlides() {\n    if (slides().length) { render(); return; }\n    setTimeout(awaitSlides, 150);\n  })();\n\n  function onEvent(ev, p) {\n    if (ev === '_joined') { helloLoop(); return; }\n    if (ev !== 'state') return;\n    gotState = true;\n    st = p;\n    render();\n  }\n\n  setInterval(function () {\n    if (!st.t0) return;\n    var s = Math.max(0, Math.floor((Date.now() - st.t0) / 1000));\n    q('.lv-rtime').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');\n  }, 500);\n}\n\n/* ══ Audience ═════════════════════════════════════════════════════════════ */\nfunction runAudience(deck, code) {\n  hashPrefix = 'join=' + code;\n  var mode = 'follow', live = 0, following = true, maxSeen = 0;\n  /* Slide changes this code causes -- the preflight walk, and following the\n     stage -- must not read as the viewer deliberately breaking away. */\n  var warming = true, programmatic = 0;\n  var dot = statusDot();\n  var room = new Room(code, 'audience', onEvent, function (s) { dot.set(s, s === 'live' ? 'following' : s); });\n  room.connect();\n  wakeLock();\n\n  var lockLayer = null, backBtn = null;\n\n  /* The reading view is the readable one on a phone, so a synced audience is\n     pinned to the card for the live slide rather than a shrunken artboard.\n     Cards are matched by data-slide when the deck provides it, else by order. */\n  function mvCards() { return Array.prototype.slice.call(document.querySelectorAll('#mv .mv-card')); }\n  function pinReading(i) {\n    var cards = mvCards();\n    if (!cards.length) return;\n    var target = null;\n    for (var k = 0; k < cards.length; k++) if (String(cards[k].getAttribute('data-slide')) === String(i)) target = cards[k];\n    if (!target && cards.length === slides().length) target = cards[i];\n    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });\n  }\n\n  function applyLock() {\n    var want = (mode === 'lock');\n    if (want && !lockLayer) {\n      lockLayer = document.createElement('div'); lockLayer.className = 'lv-lock';\n      /* Swallow everything the deck would treat as navigation. */\n      ['click', 'touchstart', 'touchend', 'pointerdown'].forEach(function (ev) {\n        lockLayer.addEventListener(ev, function (e) { e.stopPropagation(); e.preventDefault(); }, true);\n      });\n      document.body.appendChild(lockLayer);\n    } else if (!want && lockLayer) { lockLayer.remove(); lockLayer = null; }\n  }\n\n  function showBack(on) {\n    if (on && !backBtn) {\n      backBtn = document.createElement('button');\n      backBtn.className = 'lv-back'; backBtn.textContent = '● Back to live';\n      backBtn.addEventListener('click', function () { following = true; go(live); showBack(false); });\n      document.body.appendChild(backBtn);\n    } else if (!on && backBtn) { backBtn.remove(); backBtn = null; }\n  }\n\n  function go(i) {\n    programmatic++;\n    try { deck.goTo(i); } catch (e) {}\n    setTimeout(function () { programmatic--; }, 120);\n    if (document.body.classList.contains('mv-on')) pinReading(i);\n  }\n\n  var gotState = false;\n  function helloLoop() {\n    if (gotState) return;\n    room.cast('hello', {});\n    setTimeout(helloLoop, 1500);\n  }\n\n  function onEvent(ev, p) {\n    if (ev === '_joined') { helloLoop(); return; }\n    if (ev !== 'state') return;\n    gotState = true;\n    /* A stage mid-preflight is walking every slide to warm it. Following that\n       would drag every phone in the room through the whole deck at speed. */\n    if (p.ready === false) { dot.set('live', 'waiting for the stage'); return; }\n    live = p.i; maxSeen = Math.max(maxSeen, p.max || p.i);\n    if (p.mode !== mode) { mode = p.mode; applyLock(); }\n    if (mode === 'open') { showBack(false); return; }\n    if (following || mode === 'lock') go(live);\n    else showBack(true);\n    dot.set('live', 'slide ' + (p.i + 1) + ' / ' + p.n);\n  }\n\n  /* A swipe or tap while in follow mode is a deliberate break-away. */\n  document.addEventListener('slidechange', function (e) {\n    var i = (e.detail && e.detail.index) || 0;\n    if (warming || programmatic) return;\n    if (mode === 'lock' || mode === 'open') return;\n    if (i !== live) { following = false; showBack(true); }\n  });\n\n  var react = document.createElement('div');\n  react.className = 'lv-panel';\n  react.style.cssText = 'left:14px;right:14px;bottom:56px;padding:10px;display:none';\n  react.innerHTML = '<div class=\"lv-react\"><button data-k=\"lost\">I\\'m lost<\/button><\/div>';\n  document.body.appendChild(react);\n  react.querySelector('[data-k=lost]').addEventListener('click', function () {\n    room.cast('react', { k: 'lost', id: room.id });\n    react.querySelector('[data-k=lost]').textContent = 'Sent';\n    setTimeout(function () { react.querySelector('[data-k=lost]').textContent = \"I'm lost\"; }, 4000);\n  });\n  dot.el.addEventListener('click', function () { react.style.display = react.style.display === 'none' ? '' : 'none'; });\n\n  /* Same preflight as the stage: a phone that joins mid-talk should not\n     stutter through its first few slides. */\n  preflight(deck, room, function () {}).then(function () {\n    warming = false;\n    showBack(false);                 // the warm pass is not a break-away\n    room.cast('hello', {});          // and now tell the stage where to put us\n  });\n}\n\n/* ══ Boot ═════════════════════════════════════════════════════════════════ */\nfunction boot() {\n  var r = readRole();\n  injectCss();\n\n  if (r && r.role === 'remote') { runRemote(r.code, r.tok); return; }\n\n  whenDeck(function (deck) {\n    if (r && r.role === 'stage') runStage(deck);\n    else if (r && r.role === 'audience') runAudience(deck, r.code);\n    else {\n      /* Not live: one key turns this tab into the stage. */\n      window.addEventListener('keydown', function onKey(e) {\n        if (e.key !== 'l' && e.key !== 'L') return;\n        if (e.target && /input|textarea/i.test(e.target.tagName)) return;\n        window.removeEventListener('keydown', onKey);\n        runStage(deck);\n      });\n    }\n  });\n}\n\nif (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);\nelse boot();\n\n})();\n<\/script>\n\n<\/body><\/html>\n"

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opening deck…</title>
<meta name="theme-color" content="#101013">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
  html,body{margin:0;height:100%;background:#101013;color:#F3F3F1;font-family:Arial,Helvetica,sans-serif}
  .mid{height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:min(420px,84vw);text-align:center}
  .t{font-size:18px;font-weight:700;letter-spacing:.01em}
  .bar{margin:18px 0 10px;height:3px;background:#2A2A31;border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;width:22%;background:#E2545C;border-radius:2px;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-24%}100%{margin-left:100%}}
  .s{font-size:13px;letter-spacing:.05em;color:#8A8A92;line-height:1.6}
  .s a{color:#E2545C;text-decoration:none}
  .err .bar{display:none}
  .err .t{color:#E2545C}
</style>
</head>
<body>
<div class="mid"><div class="card" id="card">
  <div class="t" id="t">Opening the deck</div>
  <div class="bar"><i></i></div>
  <div class="s" id="s">Fetching it now.</div>
</div></div>

<script>
/* Decks are uploaded to Supabase Storage, but Supabase will not serve a
   working web page from its own domain: it rewrites the content type to
   text/plain and attaches `Content-Security-Policy: default-src 'none';
   sandbox`, so nothing would run. Fetching the file is fine though -- public
   objects are CORS-open -- so the deck is pulled in here, on a host that is
   allowed to run pages, and this document becomes it.

   The storage path rides in ?p= rather than the fragment because the deck's
   own live layer owns the fragment and rewrites it to #live/3, #join=CODE/3
   and so on. Put the path there and it would be gone the moment the deck
   started, taking reloads and every QR link with it. */
(function () {
  var SUPABASE = 'https://wbmzoscwlaanwtiloufs.supabase.co';
  var BUCKET = 'decks';

  function fail(title, detail) {
    document.getElementById('card').className = 'card err';
    document.getElementById('t').textContent = title;
    document.getElementById('s').innerHTML = detail +
      ' <br><br><a href="../">Back to your presentations</a>';
    document.title = title;
  }

  var path = new URLSearchParams(location.search).get('p');
  if (!path) return fail('No deck asked for', 'This link is missing the deck it should open.');
  if (path.indexOf('..') !== -1) return fail('That path is not allowed', 'Open the deck from your dashboard instead.');

  fetch(SUPABASE + '/storage/v1/object/public/' + BUCKET + '/' + path.split('/').map(encodeURIComponent).join('/'))
    .then(function (r) {
      if (!r.ok) throw new Error(r.status === 400 || r.status === 404
        ? 'That deck is not there any more — it may have been deleted.'
        : 'The server said ' + r.status + '.');
      return r.text();
    })
    .then(function (html) {
      if (!/deck-stage|<section/i.test(html)) throw new Error('That file does not look like a deck.');
      /* Becoming the deck: open() clears this document, write() parses the
         deck into it and runs its scripts, close() ends the stream so
         DOMContentLoaded fires for the deck's own loader. The URL, and so
         everything the live layer builds from it, stays exactly as it is. */
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function (e) {
      fail('Could not open that deck', (e && e.message) || 'Something went wrong fetching it.');
    });
})();
</script>
</body>
</html>
